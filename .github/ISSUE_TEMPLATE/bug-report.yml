name: Report a catalog or website issue
description: Report a broken link, inaccurate detail, or interface problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog entry
        - Search or filter
        - Workflow picker
        - Saved tools or comparison
        - Accessibility or layout
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page and steps to reproduce. Do not attach samples, secrets, or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL (if reporting a catalog detail)
